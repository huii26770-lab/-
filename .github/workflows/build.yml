name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      
      - uses: gradle/actions/setup-gradle@v3
        with: {gradle-version: 8.7}
      - name: Create project
        run: |
          mkdir -p proj/app/src/main/java/com/claud/glass
          mkdir -p proj/app/src/main/res/drawable
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/mipmap-anydpi-v26
          cd proj
          cat > settings.gradle.kts <<'E'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ClaudLiquidGlassLauncher"
          include(":app")
          E
          cat > build.gradle.kts <<'E'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'E'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.claud.glass"
              compileSdk = 34
              defaultConfig { applicationId = "com.claud.glass"; minSdk = 30; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          E
          cat > app/src/main/AndroidManifest.xml <<'E'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:theme="@style/Glass">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                      android:stateNotNeeded="true" android:resizeableActivity="false">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          E
          cat > app/src/main/res/values/strings.xml <<'E'
          <resources><string name="app_name">Claud Liquid Glass Launcher</string></resources>
          E
          cat > app/src/main/res/values/styles.xml <<'E'
          <resources>
              <style name="Glass" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowShowWallpaper">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          E
          cat > app/src/main/res/drawable/ic_bg.xml <<'E'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><gradient android:angle="45" android:startColor="#6EC8FF" android:endColor="#B47CFF"/></shape>
          E
          cat > app/src/main/res/drawable/ic_fg.xml <<'E'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#99FFFFFF" android:strokeColor="#FFFFFF" android:strokeWidth="1.5"
                  android:pathData="M54,30 C68,30 78,41 78,54 C78,68 68,78 54,78 C40,78 30,68 30,54 C30,41 40,30 54,30 Z"/>
              <path android:fillColor="#CCFFFFFF" android:pathData="M42,40 C46,35 54,34 58,36 C52,37 46,41 43,47 C41,45 41,42 42,40 Z"/>
          </vector>
          E
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'E'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          E
          cat > app/src/main/java/com/claud/glass/MainActivity.kt <<'E'
          package com.claud.glass

          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : android.app.Activity() {
              private lateinit var root: FrameLayout
              private lateinit var home: LinearLayout
              private lateinit var drawer: LinearLayout
              private lateinit var grid: GridLayout
              private lateinit var clock: TextView
              private lateinit var date: TextView
              private var apps = listOf<ResolveInfo>()
              private fun px(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  window.setDecorFitsSystemWindows(false)
                  loadApps()
                  root = FrameLayout(this)
                  setContentView(root)
                  buildHome(); buildDrawer()
                  setBlur(0)
              }

              private fun loadApps() {
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  apps = packageManager.queryIntentActivities(i, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
              }

              private fun glass(radius: Int = 32, alpha: Int = 0x44) = GradientDrawable(
                  GradientDrawable.Orientation.TOP_BOTTOM,
                  intArrayOf(Color.argb(alpha + 0x22, 255, 255, 255), Color.argb(alpha / 3, 255, 255, 255))
              ).apply { cornerRadius = px(radius).toFloat(); setStroke(px(1), Color.argb(0x99, 255, 255, 255)) }

              private fun setBlur(r: Int) {
                  if (Build.VERSION.SDK_INT >= 31) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_BLUR_BEHIND)
                      window.setBackgroundBlurRadius(r)
                      window.attributes = window.attributes.apply { blurBehindRadius = r }
                  }
              }

              private fun buildHome() {
                  home = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(px(20), px(90), px(20), px(30))
                  }
                  clock = TextView(this).apply {
                      textSize = 72f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      typeface = Typeface.create("sans-serif-thin", Typeface.NORMAL)
                      setShadowLayer(12f, 0f, 2f, 0x66000000)
                  }
                  date = TextView(this).apply { textSize = 18f; setTextColor(0xDDFFFFFF.toInt()); gravity = Gravity.CENTER }
                  home.addView(clock); home.addView(date)
                  updateClock()

                  val card = TextView(this).apply {
                      text = "Swipe up for all apps"; setTextColor(Color.WHITE); textSize = 15f
                      gravity = Gravity.CENTER; background = glass(28); setPadding(px(20), px(28), px(20), px(28))
                  }
                  home.addView(card, LinearLayout.LayoutParams(-1, -2).apply { topMargin = px(40) })
                  home.addView(View(this), LinearLayout.LayoutParams(-1, 0, 1f))

                  val dock = LinearLayout(this).apply { background = glass(36); setPadding(px(14), px(14), px(14), px(14)); gravity = Gravity.CENTER }
                  listOf(Intent.CATEGORY_APP_BROWSER, Intent.CATEGORY_APP_MESSAGING, Intent.CATEGORY_APP_GALLERY, Intent.CATEGORY_APP_MUSIC).forEach { cat ->
                      val ri = packageManager.resolveActivity(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                      val info = apps.firstOrNull { it.activityInfo.packageName == ri?.activityInfo?.packageName } ?: return@forEach
                      dock.addView(icon(info, false), LinearLayout.LayoutParams(0, -2, 1f))
                  }
                  home.addView(dock, LinearLayout.LayoutParams(-1, -2))

                  var y0 = 0f
                  home.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> y0 = e.rawY
                          MotionEvent.ACTION_UP -> if (y0 - e.rawY > px(80)) showDrawer(true)
                      }
                      true
                  }
                  root.addView(home, ViewGroup.LayoutParams(-1, -1))
              }

              private fun icon(ri: ResolveInfo, label: Boolean = true): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(px(4), px(10), px(4), px(10)) }
                  col.addView(ImageView(this).apply { setImageDrawable(ri.loadIcon(packageManager)) }, LinearLayout.LayoutParams(px(56), px(56)))
                  if (label) col.addView(TextView(this).apply {
                      text = ri.loadLabel(packageManager); setTextColor(Color.WHITE); textSize = 11f; maxLines = 1
                      ellipsize = android.text.TextUtils.TruncateAt.END; gravity = Gravity.CENTER
                      setShadowLayer(6f, 0f, 1f, 0x88000000)
                  })
                  col.setOnClickListener { v ->
                      v.animate().scaleX(.85f).scaleY(.85f).setDuration(90).withEndAction {
                          v.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                          packageManager.getLaunchIntentForPackage(ri.activityInfo.packageName)?.let { startActivity(it) }
                      }.start()
                  }
                  return col
              }

              private fun buildDrawer() {
                  drawer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; visibility = View.GONE
                      setPadding(px(16), px(70), px(16), px(16)); setBackgroundColor(0x22000000)
                  }
                  val search = EditText(this).apply {
                      hint = "Search apps"; setHintTextColor(0xAAFFFFFF.toInt()); setTextColor(Color.WHITE)
                      background = glass(26); setPadding(px(20), px(14), px(20), px(14)); setSingleLine()
                  }
                  grid = GridLayout(this).apply { columnCount = 4 }
                  val sv = ScrollView(this).apply { addView(grid); isVerticalScrollBarEnabled = false }
                  drawer.addView(search, LinearLayout.LayoutParams(-1, -2).apply { bottomMargin = px(12) })
                  drawer.addView(sv, LinearLayout.LayoutParams(-1, 0, 1f))
                  search.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) = fill(s.toString())
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                  })
                  fill("")
                  root.addView(drawer, ViewGroup.LayoutParams(-1, -1))
              }

              private fun fill(q: String) {
                  grid.removeAllViews()
                  val w = resources.displayMetrics.widthPixels / 4 - px(8)
                  apps.filter { it.loadLabel(packageManager).toString().contains(q, true) }.forEach {
                      grid.addView(icon(it), GridLayout.LayoutParams().apply { width = w })
                  }
              }

              private fun showDrawer(show: Boolean) {
                  if (show) {
                      drawer.visibility = View.VISIBLE; drawer.alpha = 0f; drawer.translationY = px(120).toFloat()
                      drawer.animate().alpha(1f).translationY(0f).setDuration(260).start()
                      home.animate().alpha(0f).scaleX(.94f).scaleY(.94f).setDuration(260).start()
                      setBlur(120)
                  } else {
                      drawer.animate().alpha(0f).translationY(px(120).toFloat()).setDuration(220).withEndAction { drawer.visibility = View.GONE }.start()
                      home.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(220).start()
                      setBlur(0)
                  }
              }

              private fun updateClock() {
                  val n = Date()
                  clock.text = SimpleDateFormat("h:mm", Locale.getDefault()).format(n)
                  date.text = SimpleDateFormat("EEEE, MMMM d", Locale.getDefault()).format(n)
              }

              override fun onResume() { super.onResume(); updateClock() }
              override fun onNewIntent(i: Intent?) { super.onNewIntent(i); if (drawer.visibility == View.VISIBLE) showDrawer(false) }
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() { if (drawer.visibility == View.VISIBLE) showDrawer(false) }
          }
          E
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
